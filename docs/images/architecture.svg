<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPrimary" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="#090d16" rx="12"/>

  <!-- Title Banner -->
  <rect x="30" y="25" width="940" height="60" rx="8" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Autotune v0.2.1 — End-to-End System Architecture</text>
  <text x="500" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">AI / GA-Guided Empirical LLVM Phase-Ordering Pipeline Optimization Engine</text>

  <!-- Flow Steps -->
  <!-- Step 1: Input -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="240" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">1. C/C++ Source Target</text>
    <text x="120" y="54" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">kernel.c [-w input.txt]</text>
    <text x="120" y="72" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Clang AST Metadata Extraction</text>
  </g>

  <!-- Step 2: Seeder -->
  <g transform="translate(380, 120)" filter="url(#shadow)">
    <rect width="240" height="90" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="120" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">2. Proposal Seeder</text>
    <text x="120" y="52" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">AST Rule Heuristics (--no-llm)</text>
    <text x="120" y="68" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">or LLM Seed Generator (--llm)</text>
  </g>

  <!-- Step 3: NPM Normalizer -->
  <g transform="translate(700, 120)" filter="url(#shadow)">
    <rect width="240" height="90" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="120" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">3. Pass Normalizer Gate</text>
    <text x="120" y="54" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Rejects Hallucinated Passes</text>
    <text x="120" y="72" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">NPM Canonicalization</text>
  </g>

  <!-- Connector Line Top -->
  <path d="M 300 165 L 380 165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowPrimary)"/>
  <path d="M 620 165 L 700 165" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 820 210 L 820 270 L 820 280" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: GA Loop -->
  <g transform="translate(60, 270)" filter="url(#shadow)">
    <rect width="880" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="440" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">4. Multi-Fidelity Genetic Algorithm &amp; 3-Step LLVM Driver</text>
    
    <!-- Sub-boxes -->
    <rect x="30" y="45" width="240" height="80" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="150" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">GA Operators &amp; Population</text>
    <text x="150" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Tournament, Mutator, Crossover</text>

    <rect x="320" y="45" width="240" height="80" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="440" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">3-Step LLVM Bitcode Driver</text>
    <text x="440" y="90" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">clang -O0 -&gt; opt -passes -&gt; bin</text>

    <rect x="610" y="45" width="240" height="80" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="730" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">Disaggregated Caching</text>
    <text x="730" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Atomic Compilation &amp; Perf Cache</text>
  </g>

  <!-- Connectors to Bottom Row -->
  <path d="M 220 420 L 220 480" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500 420 L 500 480" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 780 420 L 780 480" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Sandbox Correctness -->
  <g transform="translate(60, 480)" filter="url(#shadow)">
    <rect width="280" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="140" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">5. Sandbox Correctness Gate</text>
    <text x="140" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Isolated Process Sandbox Execution</text>
    <text x="140" y="70" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Stdout Checksum &amp; Exit Code Verification</text>
    <text x="140" y="88" font-family="sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">Mismatched output =&gt; Fitness = -inf</text>
  </g>

  <!-- Step 6: Baseline Gate -->
  <g transform="translate(360, 480)" filter="url(#shadow)">
    <rect width="280" height="110" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="140" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="middle">6. Baseline Performance Gate</text>
    <text x="140" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Monotonic Latency Measurement</text>
    <text x="140" y="70" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Normalized Speedup (Cand / -O3)</text>
    <text x="140" y="88" font-family="sans-serif" font-size="10" fill="#facc15" text-anchor="middle">Prunes Slower Regressions</text>
  </g>

  <!-- Step 7: Output Prescription -->
  <g transform="translate(660, 480)" filter="url(#shadow)">
    <rect width="280" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">7. Verified Prescription</text>
    <text x="140" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Winning Pass Sequence Manifest</text>
    <text x="140" y="70" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Reproducible shell pipeline command</text>
    <text x="140" y="88" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">clang | opt -passes='...' | clang</text>
  </g>
</svg>
