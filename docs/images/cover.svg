<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1280" height="540" fill="url(#bgGrad)" />
  <rect width="1280" height="540" fill="url(#glowCyan)" />
  <rect width="1280" height="540" fill="url(#glowPurple)" />
  <rect width="1280" height="540" fill="url(#glowEmerald)" />

  <!-- Technical Grid Mesh -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60" />
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="300" x2="1280" y2="300" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="420" x2="1280" y2="420" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    
    <line x1="120" y1="0" x2="120" y2="540" />
    <line x1="240" y1="0" x2="240" y2="540" />
    <line x1="360" y1="0" x2="360" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="600" y1="0" x2="600" y2="540" />
    <line x1="720" y1="0" x2="720" y2="540" />
    <line x1="840" y1="0" x2="840" y2="540" />
    <line x1="960" y1="0" x2="960" y2="540" />
    <line x1="1080" y1="0" x2="1080" y2="540" />
    <line x1="1200" y1="0" x2="1200" y2="540" />
  </g>

  <!-- Glowing Flow Nodes (LLVM Optimization Graph) -->
  <g opacity="0.4" stroke-width="2">
    <!-- Connecting Edges -->
    <path d="M 160 300 L 320 270 L 500 290 L 700 260 L 900 280 L 1100 250" fill="none" stroke="#0ea5e9" stroke-dasharray="6,6" />
    <path d="M 320 270 L 460 380 L 700 390 L 900 280" fill="none" stroke="#8b5cf6" stroke-dasharray="4,4" />
    
    <!-- Nodes -->
    <circle cx="160" cy="300" r="8" fill="#38bdf8" />
    <circle cx="320" cy="270" r="10" fill="#0284c7" />
    <circle cx="500" cy="290" r="9" fill="#6366f1" />
    <circle cx="700" cy="260" r="11" fill="#8b5cf6" />
    <circle cx="900" cy="280" r="9" fill="#10b981" />
    <circle cx="1100" cy="250" r="12" fill="#34d399" />
    <circle cx="460" cy="380" r="8" fill="#a855f7" />
    <circle cx="700" cy="390" r="9" fill="#06b6d4" />
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(80, 52)">
    <rect width="360" height="32" rx="16" fill="#1e293b" stroke="url(#badgeBorder)" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#34d399" />
    <text x="32" y="21" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600" letter-spacing="1">
      LLVM PHASE-ORDERING DOCTOR • V0.5
    </text>
  </g>

  <!-- Main Hero Heading -->
  <text x="80" y="148" fill="url(#textGrad)" class="font-sans" font-size="62" font-weight="900" letter-spacing="-1.5">
    AUTOTUNE
  </text>
  <text x="445" y="148" fill="#f8fafc" class="font-sans" font-size="62" font-weight="300" letter-spacing="-1">
    DOCTOR
  </text>

  <!-- Subtitle & Value Proposition -->
  <text x="82" y="195" fill="#e2e8f0" class="font-sans" font-size="21" font-weight="600" letter-spacing="-0.2">
    AI-Guided Compiler Optimization &amp; Scientific Phase-Ordering Engine
  </text>
  
  <text x="82" y="228" fill="#94a3b8" class="font-sans" font-size="15" font-weight="400">
    Systematically search, prove, and synthesize workload-specific LLVM pipelines to outperform standard <tspan fill="#38bdf8" font-weight="600">-O3</tspan>.
  </text>
  <text x="82" y="250" fill="#94a3b8" class="font-sans" font-size="15" font-weight="400">
    Zero data fabrication • Welch's t-test statistical validation • Multi-format production compiler export.
  </text>

  <!-- Live Verified Speedup Cards -->
  <g transform="translate(80, 280)">
    <!-- Card 1: Conv2D -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="18" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">2D CONVOLUTION</text>
      <text x="18" y="66" fill="#38bdf8" class="font-sans" font-size="32" font-weight="800">13.56×</text>
      <text x="126" y="62" fill="#34d399" class="font-mono" font-size="11" font-weight="700">GRADE A</text>
      <text x="18" y="84" fill="#64748b" class="font-mono" font-size="10">SIMD + Loop Unroll</text>
    </g>

    <!-- Card 2: PolyBench GEMM -->
    <g transform="translate(225, 0)" filter="url(#shadow)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="18" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">POLYBENCH GEMM</text>
      <text x="18" y="66" fill="#818cf8" class="font-sans" font-size="32" font-weight="800">12.58×</text>
      <text x="126" y="62" fill="#34d399" class="font-mono" font-size="11" font-weight="700">GRADE A</text>
      <text x="18" y="84" fill="#64748b" class="font-mono" font-size="10">SLP + SROA + Vector</text>
    </g>

    <!-- Card 3: BiCG Solver -->
    <g transform="translate(450, 0)" filter="url(#shadow)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="18" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">BICG GRADIENT</text>
      <text x="18" y="66" fill="#c084fc" class="font-sans" font-size="32" font-weight="800">4.77×</text>
      <text x="122" y="62" fill="#34d399" class="font-mono" font-size="11" font-weight="700">GRADE A</text>
      <text x="18" y="84" fill="#64748b" class="font-mono" font-size="10">Kernel Vectorization</text>
    </g>

    <!-- Card 4: N-Body Physics -->
    <g transform="translate(675, 0)" filter="url(#shadow)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="18" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">N-BODY GRAVITY</text>
      <text x="18" y="66" fill="#34d399" class="font-sans" font-size="32" font-weight="800">4.06×</text>
      <text x="122" y="62" fill="#34d399" class="font-mono" font-size="11" font-weight="700">GRADE A</text>
      <text x="18" y="84" fill="#64748b" class="font-mono" font-size="10">Pairwise Force SIMD</text>
    </g>

    <!-- Card 5: Matrix Transpose (vs -O3) -->
    <g transform="translate(900, 0)" filter="url(#shadow)">
      <rect width="220" height="96" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="18" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">STRIDE TRANSPOSE</text>
      <text x="18" y="66" fill="#fbbf24" class="font-sans" font-size="32" font-weight="800">+30.2%</text>
      <text x="136" y="62" fill="#f59e0b" class="font-mono" font-size="11" font-weight="700">OVER -O3</text>
      <text x="18" y="84" fill="#64748b" class="font-mono" font-size="10">Cache Stride Tuning</text>
    </g>
  </g>

  <!-- Bottom Technical Guarantees Ribbon -->
  <g transform="translate(80, 420)">
    <!-- Terminal Command Snippet -->
    <rect width="450" height="52" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="20" cy="26" r="4" fill="#ef4444" />
    <circle cx="34" cy="26" r="4" fill="#f59e0b" />
    <circle cx="48" cy="26" r="4" fill="#10b981" />
    <text x="68" y="32" fill="#38bdf8" class="font-mono" font-size="13" font-weight="600">$</text>
    <text x="86" y="32" fill="#f1f5f9" class="font-mono" font-size="13">autotune doctor kernel.c --preset quick</text>

    <!-- Badges Row -->
    <g transform="translate(480, 10)">
      <!-- Statistical Rigor -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="22" fill="#34d399" class="font-mono" font-size="12" font-weight="700">✓</text>
        <text x="30" y="21" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">Welch p &lt; 0.001</text>
      </g>

      <!-- LLVM 14-22 -->
      <g transform="translate(195, 0)">
        <rect width="170" height="34" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="22" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">⚙</text>
        <text x="30" y="21" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">LLVM 14 – 22 NPM</text>
      </g>

      <!-- Zero Leakage -->
      <g transform="translate(380, 0)">
        <rect width="170" height="34" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="22" fill="#818cf8" class="font-mono" font-size="12" font-weight="700">🔒</text>
        <text x="30" y="21" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">OS Keyring Native</text>
      </g>

      <!-- Clean CI Gate -->
      <g transform="translate(565, 0)">
        <rect width="145" height="34" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="22" fill="#fbbf24" class="font-mono" font-size="12" font-weight="700">🛡</text>
        <text x="30" y="21" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">CI Guard Gate</text>
      </g>
    </g>
  </g>
</svg>
