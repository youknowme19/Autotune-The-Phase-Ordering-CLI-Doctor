name: Publish PyPI Package and Release Assets

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test Matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM / Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev
          for ver in 19 18 17 16 15 14; do
            if [ -d "/usr/lib/llvm-$ver/bin" ]; then
              echo "/usr/lib/llvm-$ver/bin" >> $GITHUB_PATH
              export PATH="/usr/lib/llvm-$ver/bin:$PATH"
            fi
            if [ -f "/usr/bin/opt-$ver" ] && ! which opt >/dev/null 2>&1; then
              sudo ln -sf "/usr/bin/opt-$ver" /usr/local/bin/opt
            fi
            if [ -f "/usr/bin/clang-$ver" ] && ! which clang >/dev/null 2>&1; then
              sudo ln -sf "/usr/bin/clang-$ver" /usr/local/bin/clang
            fi
          done

      - name: Install LLVM / Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "/opt/homebrew/opt/llvm/bin" ]; then
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
            export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          fi
          if [ -d "/usr/local/opt/llvm/bin" ]; then
            echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH
            export PATH="/usr/local/opt/llvm/bin:$PATH"
          fi
          which opt || brew install llvm || true
          if [ -d "/opt/homebrew/opt/llvm/bin" ]; then
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          fi
          if [ -d "/usr/local/opt/llvm/bin" ]; then
            echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH
          fi

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest -v

  build-and-publish-pypi:
    name: Build & Publish to PyPI
    needs: test-and-lint
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine flit_core

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Check twine metadata
        run: |
          twine check dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts
          path: dist/

      - name: Publish package to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release-artifacts:
    name: Attach Artifacts to GitHub Release
    needs: build-and-publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-artifacts
          path: dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
