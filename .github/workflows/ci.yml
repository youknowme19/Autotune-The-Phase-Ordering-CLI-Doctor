name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/ --exit-zero

      - name: Check Formatting with Black
        run: |
          black --check --diff src/ tests/ || true

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM / Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev
          for ver in 19 18 17 16 15 14; do
            if [ -d "/usr/lib/llvm-$ver/bin" ]; then
              echo "/usr/lib/llvm-$ver/bin" >> $GITHUB_PATH
            fi
            if [ -f "/usr/bin/opt-$ver" ] && ! which opt >/dev/null 2>&1; then
              sudo ln -sf "/usr/bin/opt-$ver" /usr/local/bin/opt
            fi
            if [ -f "/usr/bin/clang-$ver" ] && ! which clang >/dev/null 2>&1; then
              sudo ln -sf "/usr/bin/clang-$ver" /usr/local/bin/clang
            fi
          done

      - name: Install LLVM / Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          which opt || brew install llvm || true
          if [ -d "/opt/homebrew/opt/llvm/bin" ]; then
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          fi
          if [ -d "/usr/local/opt/llvm/bin" ]; then
            echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH
          fi

      - name: Install Autotune package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Toolchain Doctor Check
        run: |
          autotune doctor

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=src/autotune --cov-report=term-missing

      - name: Run Baseline Diagnosis Verification
        run: |
          autotune diagnose ./examples/simple_loop/kernel.c --workload ./examples/simple_loop/input.txt

      - name: Run Profile Verification
        run: |
          autotune profile ./examples/simple_loop/kernel.c --json
