[build-system]
requires = ["flit_core >=3.8.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "autotune-doctor"
version = "0.1.0"
description = "AI-guided compiler optimization and LLVM phase-ordering doctor for C/C++ workloads"
readme = "README.md"
authors = [
    { name = "Autotune Contributors", email = "engineering@autotune.dev" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pyinstaller>=6.0.0",
    "flit_core>=3.8.0",
]

[project.scripts]
autotune = "autotune.cli:app"

[tool.flit.module]
name = "autotune"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
